edition = "2023";

package research_scann;

import "scann/distance_measures/one_to_many/scale_encoding.proto";
import "scann/proto/centers.proto";
import "scann/proto/exact_reordering.proto";
import "scann/proto/hash.proto";
import "scann/utils/fixed_point/fixed_point_training_results.proto";

message AsymmetricHashingCodec {
  AsymmetricHasherConfig model_config = 1;
  CentersForAllSubspaces model_data = 2;
}

message FixedPointCodec {
  oneof fixed_point_method {
    float multiplier = 1;

    FixedPointTrainingResults training_results = 2;
  }

  int32 dimension = 3;

  ScaleEncoding scale_encoding = 4;

  int32 per_dimension_bits = 5 [default = 8];
}

message Codec {
  oneof coding_scheme {
    AsymmetricHashingCodec asymmetric_hash = 1;
    FixedPointCodec fixed_point = 2;
  }
}

message CodecConfig {
  oneof config {
    AsymmetricHasherConfig ah_config = 1;
    FixedPoint fp_config = 2;
  }
}
